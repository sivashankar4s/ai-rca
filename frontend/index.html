<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Root Cause Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>AI Root Cause Analyzer</h1>
  <span class="badge">US1</span>
</header>

<main>

  <!-- Filter panel -->
  <section class="filter-panel" aria-label="Failure search filters">

    <div class="field">
      <label for="time-range">Time Range</label>
      <select id="time-range">
        <option value="1h">Last 1 Hour</option>
        <option value="1d" selected>Last 1 Day</option>
        <option value="1w">Last 1 Week</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>

    <div class="custom-dates" id="custom-dates">
      <div class="field">
        <label for="start-dt">Start</label>
        <input type="datetime-local" id="start-dt" />
      </div>
      <div class="field">
        <label for="end-dt">End</label>
        <input type="datetime-local" id="end-dt" />
      </div>
    </div>

    <div class="field">
      <label for="component">Component (optional)</label>
      <input type="text" id="component" placeholder="e.g. dp-lz-s3-event-processor" style="min-width:260px" />
    </div>

    <button class="btn" id="fetch-btn" type="button">
      <span id="fetch-spinner" class="spinner" style="display:none"></span>
      Fetch Failures
    </button>

  </section>

  <!-- Error banner -->
  <div class="error-banner" id="error-banner" role="alert" style="display:none"></div>

  <!-- Selection bar -->
  <div class="selection-bar" id="selection-bar">
    <span id="selection-count"></span>
    <button class="clear-btn" id="clear-selection-btn" type="button">Clear selection</button>
  </div>

  <!-- Results header -->
  <div class="results-header" id="results-header" style="display:none">
    <div class="summary" id="results-summary"></div>
    <div class="page-size-wrapper">
      <label for="page-size">Rows per page:</label>
      <select id="page-size">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
    </div>
  </div>

  <!-- Table / empty state -->
  <div id="table-area"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none"></div>

  <!-- ── GitHub Integration ────────────────────────────────────────────── -->
  <section class="github-section" id="github-section" aria-label="GitHub integration">
    <h2 class="section-title">GitHub — Source Code Intelligence</h2>

    <div id="github-not-configured" class="github-notice hidden">
      GitHub is not configured. Set <strong>GITHUB_REPO</strong> and <strong>GITHUB_TOKEN</strong>.
    </div>

    <div id="github-content">
      <div class="github-subsection">
        <div class="github-subsection-header">
          <h3>Pull Requests</h3>
          <div class="btn-group" id="github-pr-state-group">
            <button class="btn btn-sm active" data-state="open">Open</button>
            <button class="btn btn-sm" data-state="closed">Closed</button>
            <button class="btn btn-sm" data-state="all">All</button>
          </div>
          <button class="btn btn-sm" id="github-prs-refresh" title="Refresh">&#8635;</button>
        </div>
        <div id="github-prs-list" class="github-list">
          <p class="github-empty">Loading pull requests…</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Code review result panel (shared for PR and branch reviews) -->
  <section class="code-review-section hidden" id="code-review-section" aria-label="Code review">
    <div class="code-review-header">
      <h2>AI Code Review — <span id="code-review-target"></span></h2>
      <button class="btn btn-sm" id="code-review-close" title="Close">&#10005;</button>
    </div>
    <div id="code-review-body"></div>
    <!-- Post to PR action (only rendered for PR reviews) -->
    <div id="post-to-pr-panel" class="post-to-pr-panel hidden">
      <button class="btn btn-primary" id="post-to-pr-btn" type="button">Post to PR</button>
      <span id="post-to-pr-spinner" class="spinner hidden"></span>
      <div id="post-to-pr-result" class="post-result hidden"></div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
